<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅人記事</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Serif TC", "Songti SC", "PingFang TC", serif;
      }

      body {
        margin: 0;
        background: #f7f4ef;
        color: #2b2b2b;
      }

      header {
        padding: 32px 20px 12px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 2px;
      }

      header p {
        margin: 8px 0 0;
        color: #5a5047;
      }

      main {
        max-width: 920px;
        margin: 0 auto 48px;
        padding: 0 20px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .controls button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        background: #3b2f2a;
        color: #fffaf3;
        font-size: 14px;
        cursor: pointer;
      }

      .controls button:hover {
        background: #2c211d;
      }

      .content {
        background: #fffdf9;
        border: 1px solid #e6dfd6;
        border-radius: 12px;
        padding: 28px 24px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        font-size: 16px;
        line-height: 1.8;
        white-space: pre-wrap;
      }

      .footer {
        text-align: center;
        color: #7a6d62;
        font-size: 13px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>旅人記事</h1>
      <p>一頁瀏覽目前的文章內容</p>
    </header>
    <main>
      <div class="controls">
        <button id="load-local" type="button">載入本機 read.txt</button>
      </div>
      <input id="file-input" type="file" accept=".txt" hidden />
      <pre class="content" id="article">讀取中…</pre>
      <div class="footer">內容來自 read.txt</div>
    </main>
    <script>
      const article = document.getElementById("article");
      const loadLocalButton = document.getElementById("load-local");
      const fileInput = document.getElementById("file-input");

      const setArticle = (text) => {
        article.textContent = text.trim();
      };

      fetch("read.txt")
        .then((response) => response.text())
        .then((text) => {
          setArticle(text);
        })
        .catch(() => {
          article.textContent =
            "無法載入內容，請確認 read.txt 是否存在，或改用「載入本機 read.txt」。";
        });

      loadLocalButton.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (event) => {
        const [file] = event.target.files;
        if (!file) {
          return;
        }
        const reader = new FileReader();
        reader.onload = () => setArticle(reader.result || "");
        reader.readAsText(file);
      });
    </script>
  </body>
</html>
